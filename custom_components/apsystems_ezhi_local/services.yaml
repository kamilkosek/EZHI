set_power:
  name: Set output power
  description: >-
    Set the grid setpoint of the APsystems EZHI inverter. Positive discharges
    to the grid, negative charges from it. Only takes effect in the Local
    system mode — in the other modes the inverter answers SUCCESS and keeps
    running its own strategy.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are, because this call will not pick one for you.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    power:
      name: Power
      description: Power in watts
      required: true
      example: 600
      selector:
        number:
          min: -1200
          max: 1200
          step: 10
          unit_of_measurement: W

set_high_power_mode:
  name: Set high power mode
  description: >-
    Switch the EZHI output ceiling between 800 W (standard) and 1200 W (high
    power). DISCLAIMER, quoted from the APsystems app: enabling high power mode
    "may cause the device output to exceed regulatory limits for grid
    connection. Any legal risks, safety incidents, or other consequences
    arising therefrom shall be solely your responsibility." This is a service
    rather than a switch entity so that enabling it cannot happen with one
    stray tap on a dashboard.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are -- raising a regulatory ceiling on a device you did not mean is
        exactly what this field prevents.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    enable:
      name: Enable high power mode
      description: On sets the ceiling to 1200 W, off returns it to 800 W.
      required: true
      selector:
        boolean:
    acknowledge_regulatory_risk:
      name: I accept the regulatory risk
      description: >-
        Required when enabling. Confirms you have read the disclaimer above and
        accept responsibility for operating above the standard 800 W ceiling.
        Not needed when switching back down to 800 W.
      required: false
      default: false
      selector:
        boolean:

ble_raw_get:
  name: BLE raw get (diagnostic)
  description: >-
    Read one get-identifier over the Bluetooth transport and log the raw reply
    at WARNING. Diagnostic tool: the default identifier `outputData` returns
    pcsOriginalData, the raw inverter frames the local HTTP API does not
    expose. Only works while the control transport is Bluetooth.
  fields:
    device_id:
      name: Device
      description: >-
        Which inverter. Optional when only one is set up; required when several
        are.
      required: false
      selector:
        device:
          integration: apsystems_ezhi_local
    identifier:
      name: Identifier
      description: >-
        The get-identifier to request (outputData, deviceInfo, si, meterStatus,
        light, bindDevice, systemMode).
      required: false
      default: outputData
      example: outputData
      selector:
        text:
